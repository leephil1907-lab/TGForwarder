name: TGForwarder CI

on:
  push:
    branches: [main, production-v2-isolation-history-editor]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
          APP_AUTH_TOKEN: ci-test-token

      - name: Verify build artifacts
        run: |
          test -f dist/index.html
          test -f dist/server.cjs
