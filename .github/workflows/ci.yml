name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Channel-routing proof
        run: npx -y tsx routing.mts
      - name: Media pipeline proof
        run: npx -y tsx media.mts
      - name: Engineering fallback proof
        run: npx -y tsx fallback.mts
